# Runs the test suite on every push and pull request,
# on Linux and Windows, with the oldest and newest supported Python.
# No API key is needed: the tests use fake models.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false   # finish every combination, so one failure does not hide another
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check benchmark tasks are valid
        run: codefix bench-check

      - name: Run tests
        run: pytest

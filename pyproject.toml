[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codefix-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pytest>=8", "anthropic>=0.40", "python-dotenv>=1.0"]

[project.scripts]
codefix = "codefix.cli:main"

[tool.setuptools]
packages = ["codefix"]

[tool.pytest.ini_options]
testpaths = ["tests"]